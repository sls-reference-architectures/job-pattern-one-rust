[package]
name = "cold-start-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-config = "1.12.0"
aws-sdk-cloudformation = "1.129.0"
aws-sdk-cloudwatch = "1.133.0"
aws-sdk-lambda = "1.148.0"
base64 = "0.23.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[lib]
name = "probe"
path = "src/lib.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"
