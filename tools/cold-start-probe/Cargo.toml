[package]
name = "cold-start-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-config = "1.12.0"
aws-sdk-cloudformation = { version = "1.129.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-cloudwatch = { version = "1.133.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lambda = { version = "1.148.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.23.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[lib]
name = "probe"
path = "src/lib.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"
