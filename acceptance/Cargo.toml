[package]
name = "acceptance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-config = "1.12.0"
aws-credential-types = "1.3.0"
aws-sdk-cloudformation = { version = "1.129.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = "1.6.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

[features]
acceptance = []

[[test]]
name = "acceptance"
path = "tests/specs/main.rs"
required-features = ["acceptance"]
