[package]
name = "jobs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
integration = []

[dependencies]
aws-config = { version = "1.12.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.128.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-eventbridge = { version = "1.121.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sfn = { version = "1.119.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws_lambda_events = { version = "1.2.0", default-features = false, features = ["dynamodb", "eventbridge"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
lambda_http = { version = "1.3.1", default-features = false, features = ["apigw_http", "tracing"] }
lambda_runtime = { version = "1.4.0", default-features = false, features = ["tracing"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
ulid = "3.0.0"

[[bin]]
name = "createJob"
path = "src/bin/create_job.rs"

[[bin]]
name = "getJob"
path = "src/bin/get_job.rs"

[[bin]]
name = "onDbStreamEvent"
path = "src/bin/on_db_stream_event.rs"

[[bin]]
name = "onJobCreated"
path = "src/bin/on_job_created.rs"

[[bin]]
name = "setJobStatusStarted"
path = "src/bin/set_job_status_started.rs"

[[bin]]
name = "translatePhrase"
path = "src/bin/translate_phrase.rs"

[[bin]]
name = "setJobStatusComplete"
path = "src/bin/set_job_status_complete.rs"

[[bin]]
name = "setJobStatusFailed"
path = "src/bin/set_job_status_failed.rs"

[[test]]
name = "unit"
path = "tests/unit/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["integration"]

[dev-dependencies]
aws-sdk-cloudformation = { version = "1.129.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
