name: CI & Test

on:
  push:
    branches: [master]
  schedule:
    - cron: '25 6 * * *' # Daily deploy; fleet staggered 5 min apart (Free plan = 20 concurrent jobs)
  workflow_dispatch:

concurrency: one-at-a-time-please

# These permissions are needed to interact with GitHub's OIDC Token endpoint.
permissions:
  id-token: write
  contents: read

jobs:
  buildDeployTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install zig (arm64 cross-linker for cargo-lambda)
        # Official tarball, pinned and checksum-verified. Replaces mlugg/setup-zig, which still
        # targets the deprecated Node.js 20 Actions runtime.
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          curl -sSfL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          echo "${ZIG_SHA256}  zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TOOL_CACHE/zig" && tar -xJf zig.tar.xz -C "$RUNNER_TOOL_CACHE/zig" --strip-components=1 && rm zig.tar.xz
          echo "$RUNNER_TOOL_CACHE/zig" >> "$GITHUB_PATH"
          "$RUNNER_TOOL_CACHE/zig/zig" version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-lambda
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run unit tests
        run: cargo test --workspace
      - name: Build Lambda binaries (arm64)
        run: ./scripts/build.sh
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Install deployment tooling
        run: npm ci
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-east-1
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      - name: Deploy
        run: npx sls deploy --conceal
      - name: Run int tests
        run: cargo test -p jobs --features integration --test integration
      - name: Run acceptance tests
        run: cargo test -p acceptance --features acceptance --test acceptance
