service: job-pattern-one-rust

frameworkVersion: '4'

configValidationMode: error

# Same topology as ../job-pattern-one (the Node.js sibling) so cold starts compare like for like:
# arm64, 1024 MB, 6 s timeout, one least-privilege role per function. Every resource name derives
# from the service name so both stacks can live in the same account and region.

provider:
  name: aws
  architecture: arm64
  runtime: provided.al2023
  stage: dev
  region: us-east-1
  memorySize: 1024
  timeout: 6
  logRetentionInDays: 7
  deploymentBucket:
    name: com.reference-architecture.deploys
    maxPreviousDeploymentArtifacts: 5
    serverSideEncryption: AES256
  environment:
    EVENT_BUS_NAME: ${self:custom.eventBusName}
    TABLE_NAME: ${self:custom.tableName}

custom:
  eventBusName: ${self:service}
  tableName: ${self:service}
  stateMachineName: ${self:service}-translate

# Binaries are built by scripts/build.sh (cargo lambda, arm64) and staged as
# target/lambda/<function>.zip. osls keys uploads by file name, so names must be unique.
package:
  individually: true

functions:
  createJob:
    handler: bootstrap
    package:
      artifact: target/lambda/createJob.zip
    events:
    - httpApi:
        method: POST
        path: /jobs
        authorizer:
          type: aws_iam
    iamRoleStatements:
    - Effect: Allow
      Action: dynamodb:PutItem
      Resource: !GetAtt JobsTable.Arn

  getJob:
    handler: bootstrap
    package:
      artifact: target/lambda/getJob.zip
    events:
    - httpApi:
        method: GET
        path: /jobs/{jobId}
        authorizer:
          type: aws_iam
    iamRoleStatements:
    - Effect: Allow
      Action: dynamodb:GetItem
      Resource: !GetAtt JobsTable.Arn

  onDbStreamEvent:
    handler: bootstrap
    package:
      artifact: target/lambda/onDbStreamEvent.zip
    events:
    - stream:
        type: dynamodb
        arn: !GetAtt JobsTable.StreamArn
        batchSize: 10
        # Failure handling at scale. Without these a record that keeps failing is retried until
        # the stream's 24 h retention drops it, blocking every later change on its shard, and is
        # then lost silently. Bisect isolates the bad record; after the retry/age cap its
        # metadata (shard, sequence numbers) goes to a queue that alarms.
        bisectBatchOnFunctionError: true
        maximumRetryAttempts: 5
        maximumRecordAgeInSeconds: 3600
        destinations:
          onFailure:
            arn: !GetAtt OnDbStreamEventFailureQueue.Arn
            type: sqs
    iamRoleStatements:
    - Effect: Allow
      Action: events:PutEvents
      Resource: !GetAtt JobsEventBus.Arn
    - Effect: Allow
      Action: sqs:SendMessage
      Resource: !GetAtt OnDbStreamEventFailureQueue.Arn

  onJobCreated:
    handler: bootstrap
    package:
      artifact: target/lambda/onJobCreated.zip
    environment:
      TRANSLATE_STATE_MACHINE_ARN: !Ref TranslateStateMachine
    # Asynchronous invocation: after these retries Lambda would otherwise drop the event and the
    # job would sit in Pending forever with no trace.
    maximumRetryAttempts: 2
    maximumEventAge: 3600
    destinations:
      onFailure:
        arn: !GetAtt OnJobCreatedFailureQueue.Arn
        type: sqs
    events:
    - eventBridge:
        eventBus: !GetAtt JobsEventBus.Name
        pattern:
          source:
          - job
          detail-type:
          - create
        # Events EventBridge cannot deliver to the function (e.g. throttling past the policy).
        retryPolicy:
          maximumRetryAttempts: 185
          maximumEventAge: 3600
        deadLetterQueueArn: !GetAtt OnJobCreatedFailureQueue.Arn
    iamRoleStatements:
    - Effect: Allow
      Action: states:StartExecution
      Resource: !Ref TranslateStateMachine
    - Effect: Allow
      Action: sqs:SendMessage
      Resource: !GetAtt OnJobCreatedFailureQueue.Arn

  setJobStatusStarted:
    handler: bootstrap
    package:
      artifact: target/lambda/setJobStatusStarted.zip
    iamRoleStatements:
    - Effect: Allow
      Action: dynamodb:UpdateItem
      Resource: !GetAtt JobsTable.Arn

  translatePhrase:
    handler: bootstrap
    package:
      artifact: target/lambda/translatePhrase.zip

  setJobStatusComplete:
    handler: bootstrap
    package:
      artifact: target/lambda/setJobStatusComplete.zip
    iamRoleStatements:
    - Effect: Allow
      Action: dynamodb:UpdateItem
      Resource: !GetAtt JobsTable.Arn

  setJobStatusFailed:
    handler: bootstrap
    package:
      artifact: target/lambda/setJobStatusFailed.zip
    iamRoleStatements:
    - Effect: Allow
      Action: dynamodb:UpdateItem
      Resource: !GetAtt JobsTable.Arn

stepFunctions:
  validate: true
  stateMachines:
    translateStateMachine:
      id: TranslateStateMachine # CloudFormation logical id (same as the Node.js sibling); `name` is the AWS resource name
      name: ${self:custom.stateMachineName}
      type: EXPRESS
      loggingConfig:
        level: ALL
        includeExecutionData: false
        destinations:
        - !GetAtt TranslateStateMachineLogGroup.Arn
      definition:
        StartAt: Set Job Status Started
        States:
          Set Job Status Started:
            Type: Task
            Resource: !GetAtt setJobStatusStarted.Arn
            Retry:
            - ErrorEquals: [ConflictError]
              MaxAttempts: 0
            - ErrorEquals: [States.ALL]
              IntervalSeconds: 2
              MaxAttempts: 3
              BackoffRate: 2
            Catch:
            - ErrorEquals: [ConflictError]
              Next: Job Already Started
            - ErrorEquals: [States.ALL]
              ResultPath: $.error
              Next: Set Job Status Failed
            Next: Translate Phrase
          Job Already Started:
            Type: Succeed
            Comment: A duplicate create event; another execution already owns this job.
          Translate Phrase:
            Type: Task
            Resource: !GetAtt translatePhrase.Arn
            Retry:
            - ErrorEquals: [States.ALL]
              IntervalSeconds: 2
              MaxAttempts: 3
              BackoffRate: 2
            Catch:
            - ErrorEquals: [States.ALL]
              ResultPath: $.error
              Next: Set Job Status Failed
            Next: Set Job Status Completed
          Set Job Status Completed:
            Type: Task
            Resource: !GetAtt setJobStatusComplete.Arn
            Retry:
            - ErrorEquals: [States.ALL]
              IntervalSeconds: 2
              MaxAttempts: 3
              BackoffRate: 2
            Catch:
            - ErrorEquals: [States.ALL]
              ResultPath: $.error
              Next: Set Job Status Failed
            End: true
          Set Job Status Failed:
            Type: Task
            Resource: !GetAtt setJobStatusFailed.Arn
            Next: Fail
          Fail:
            Type: Fail

resources:
  Resources:
    JobsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        TableName: ${self:custom.tableName}
        ContributorInsightsSpecification:
          Enabled: false
        KeySchema:
        - AttributeName: id
          KeyType: HASH
        AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
    OnDbStreamEventFailureQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-on-db-stream-event-failures
        MessageRetentionPeriod: 1209600
    OnJobCreatedFailureQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-on-job-created-failures
        MessageRetentionPeriod: 1209600
    OnJobCreatedFailureQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
        - !Ref OnJobCreatedFailureQueue
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OnJobCreatedFailureQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/${self:custom.eventBusName}/*
    OnDbStreamEventFailuresAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-on-db-stream-event-failures
        AlarmDescription: Stream records exhausted their retries; jobs may be missing events. Messages hold shard and sequence numbers to re-read within 24 h.
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
        - Name: QueueName
          Value: !GetAtt OnDbStreamEventFailureQueue.QueueName
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
    OnJobCreatedFailuresAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-on-job-created-failures
        AlarmDescription: Job-created events whose workflow never started; those jobs are stuck in Pending.
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
        - Name: QueueName
          Value: !GetAtt OnJobCreatedFailureQueue.QueueName
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
    JobsEventBus:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${self:custom.eventBusName}
    TranslateStateMachineLogGroup:
      Type: AWS::Logs::LogGroup
      Properties:
        LogGroupName: /stepfunctions/${self:custom.stateMachineName}
        RetentionInDays: 7
  Outputs:
    TableName:
      Value: !Ref JobsTable
    EventBusName:
      Value: !GetAtt JobsEventBus.Name

plugins:
- serverless-iam-roles-per-function
- serverless-step-functions
